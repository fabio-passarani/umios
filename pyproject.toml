[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "quant-trading-system"
version = "0.1.0"
description = "Personal Algorithmic Trading Platform — Quantitative Strategies, Risk Management, Backtesting, Paper Trading and AI Research."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Fabio Passarani" }]
# No licence is granted yet: see docs/licensing.md (private, all rights reserved).
classifiers = ["Private :: Do Not Upload", "Programming Language :: Python :: 3"]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "SQLAlchemy>=2.0.30",
    "psycopg[binary]>=3.1.18",
    "httpx>=0.27",
    "typer>=0.12",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# GPLv3 component: kept optional so the core package never imports it.
freqtrade = ["freqtrade>=2025.6"]
reporting = ["quantstats>=0.0.64", "matplotlib>=3.8"]
ai = ["lightgbm>=4.3", "optuna>=3.6", "shap>=0.45", "scikit-learn>=1.4"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pandas-stubs",
    "types-PyYAML",
]

[project.scripts]
qts = "qts.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/qts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "network: needs internet access to the public market-data archive",
    "postgres: needs a running PostgreSQL (QTS_TEST_DATABASE_URL)",
    "freqtrade: needs the optional freqtrade extra",
    "ai: needs the optional ai extra",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "S", "PT", "C4", "DTZ"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"scripts/build_dashboard.py" = ["E501", "S608", "PLW0603"]
"tests/**" = ["S", "DTZ"]
"freqtrade/user_data/strategies/*" = ["N"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/qts"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["lightgbm.*", "optuna.*", "shap.*", "sklearn.*", "quantstats.*", "freqtrade.*", "pyarrow.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.coverage.run]
source = ["src/qts"]
branch = true

name: CI

on:
  push:
    branches: [main, develop, "claude/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  quality:
    name: Lint, format, types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,reporting]" -c requirements-lock.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  tests:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # the pinned, audited set (the same one the Docker image installs)
          - python: "3.12"
            pip_args: "-c requirements-lock.txt"
          # latest compatible releases: early warning when upstream breaks
          - python: "3.11"
            pip_args: ""
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: qts_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 3s --health-retries 20
    env:
      QTS_TEST_DATABASE_URL: postgresql://postgres:ci-only-password@127.0.0.1:5432/qts_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev,reporting,ai]" ${{ matrix.pip_args }}
      - run: pytest --cov --cov-report=term-missing --cov-report=xml --cov-fail-under=85
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.12'
        with:
          name: coverage
          path: coverage.xml

  freqtrade:
    name: Freqtrade adapter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,freqtrade]"
      - run: pytest tests/integration/test_freqtrade_adapter.py -v

  docker:
    name: Docker images and stack smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose --profile freqtrade --profile backup config --quiet
      - name: Build both images (platform and Freqtrade adapter)
        run: docker compose --profile freqtrade build
      - run: docker compose run --rm --no-deps paper-trader config
      - name: Freqtrade image loads the platform package and the adapter strategy
        run: >-
          docker run --rm --entrypoint python qts-freqtrade:local -c
          "import freqtrade, qts.integrations.freqtrade, pathlib;
          assert pathlib.Path('/freqtrade/user_data/strategies/qts_trend_following.py').is_file()"
      - name: Start PostgreSQL and Grafana, check schema, read-only role and dashboard
        run: scripts/smoke_test.sh
      - if: always()
        run: docker compose --profile freqtrade down -v

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: >-
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2
          git /repo --redact --no-banner

apiVersion: 1

datasources:
  - name: QTS PostgreSQL
    uid: qts-postgres
    type: grafana-postgresql-datasource
    access: proxy
    url: postgres:5432
    user: grafana_ro            # read-only role: dashboards cannot alter trading data
    isDefault: true
    editable: false
    jsonData:
      database: ${QTS_DB_NAME}
      sslmode: disable
      postgresVersion: 1700
      timescaledb: false
    secureJsonData:
      password: ${GRAFANA_DB_PASSWORD}

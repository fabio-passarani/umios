# Quant Trading System — local stack.
#   docker compose up -d                      -> postgres, migrations, paper trader, grafana, backups
#   docker compose --profile freqtrade up -d  -> + Freqtrade dry-run (simulated wallet)
#   docker compose run --rm backup            -> one backup into ./backups, now
# Every published port is bound to 127.0.0.1: nothing is reachable from the network.
#
# Database accounts (see docker/postgres/provision.sh):
#   ${POSTGRES_USER}  administrator - schema migrations and backups only
#   qts_app           the platform  - data only, no DDL
#   freqtrade_app     Freqtrade's own database
#   grafana_ro        read-only dashboards

name: qts

x-qts: &qts
  build:
    context: .
    args:
      GIT_COMMIT: ${GIT_COMMIT:-unknown}
  image: qts:local
  restart: unless-stopped
  environment: &qts-env
    # Passed as parts, not as a URL: the password needs no escaping.
    QTS_DB_HOST: postgres
    QTS_DB_NAME: ${POSTGRES_DB}
    QTS_DB_USER: qts_app
    QTS_DB_PASSWORD: ${QTS_APP_DB_PASSWORD:?set QTS_APP_DB_PASSWORD in .env}
    QTS_CONFIG_FILE: /app/configs/paper.yaml
    QTS_STATE_DIR: /app/state
    QTS_LOG_LEVEL: ${QTS_LOG_LEVEL:-INFO}
    QTS_LOG_JSON: ${QTS_LOG_JSON:-true}
    QTS_ENABLE_LIVE_TRADING: "false"
  volumes:
    - ./configs:/app/configs:ro
    - qts-data:/app/data
    - qts-state:/app/state
    - ./reports:/app/reports
  depends_on:
    migrate:
      condition: service_completed_successfully

x-admin-db: &admin-db
  PGHOST: postgres
  PGUSER: ${POSTGRES_USER}
  PGPASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_DB: ${POSTGRES_DB}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      QTS_APP_DB_PASSWORD: ${QTS_APP_DB_PASSWORD:?set QTS_APP_DB_PASSWORD in .env}
      FREQTRADE_DB_PASSWORD: ${FREQTRADE_DB_PASSWORD:?set FREQTRADE_DB_PASSWORD in .env}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:?set GRAFANA_DB_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/provision.sh:/docker-entrypoint-initdb.d/10-provision.sh:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Runs to completion on every `up`: roles, passwords and grants (idempotent).
  db-setup:
    image: postgres:17-alpine
    restart: "no"
    environment:
      <<: *admin-db
      QTS_APP_DB_PASSWORD: ${QTS_APP_DB_PASSWORD}
      FREQTRADE_DB_PASSWORD: ${FREQTRADE_DB_PASSWORD}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD}
    volumes:
      - ./docker/postgres/provision.sh:/provision.sh:ro
    entrypoint: ["/bin/sh", "/provision.sh"]
    depends_on:
      postgres:
        condition: service_healthy

  # Runs to completion on every `up`: versioned schema migrations, as the
  # administrator. The services below start only after it succeeded.
  migrate:
    <<: *qts
    restart: "no"
    environment:
      <<: *qts-env
      QTS_DB_USER: ${POSTGRES_USER}
      QTS_DB_PASSWORD: ${POSTGRES_PASSWORD}
    command: ["db", "upgrade"]
    depends_on:
      db-setup:
        condition: service_completed_successfully

  # Simulated trading on live data. No exchange credentials are mounted or needed.
  paper-trader:
    <<: *qts
    command: ["paper", "run", "--interval-minutes", "60"]

  # Watches everything else: health checks every 5 minutes (history in the
  # database), daily reports in ./reports/daily. Separate from the trader on
  # purpose: a trader that hangs is noticed by something that is still alive.
  monitor:
    <<: *qts
    command: ["monitor", "run", "--interval-minutes", "5", "--reports", "/app/reports/daily"]

  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-12.2.1}
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/qts-overview.json
      QTS_DB_NAME: ${POSTGRES_DB}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Optional: Freqtrade in dry-run mode (its own simulated wallet, live order book).
  # The command passes --dry-run explicitly and the config carries no API keys.
  freqtrade:
    profiles: ["freqtrade"]
    build:
      context: .
      dockerfile: docker/freqtrade/Dockerfile
    image: qts-freqtrade:local
    restart: unless-stopped
    environment:
      # hex passwords only here: Freqtrade takes a URL (generate with openssl rand -hex 24)
      FREQTRADE__DB_URL: postgresql+psycopg://freqtrade_app:${FREQTRADE_DB_PASSWORD}@postgres:5432/freqtrade
      FREQTRADE__API_SERVER__USERNAME: ${FREQTRADE_API_USERNAME:?set FREQTRADE_API_USERNAME in .env}
      FREQTRADE__API_SERVER__PASSWORD: ${FREQTRADE_API_PASSWORD:?set FREQTRADE_API_PASSWORD in .env}
      FREQTRADE__API_SERVER__JWT_SECRET_KEY: ${FREQTRADE_JWT_SECRET:?set FREQTRADE_JWT_SECRET in .env}
      QTS_CONFIG_FILE: /freqtrade/configs/paper.yaml
      QTS_STATE_DIR: /freqtrade/state
      QTS_ENABLE_LIVE_TRADING: "false"
      # Risk decisions (entries and exits) of the bot are journaled in the platform
      # database, next to the paper trader's, so the dashboard shows both.
      QTS_DB_HOST: postgres
      QTS_DB_NAME: ${POSTGRES_DB}
      QTS_DB_USER: qts_app
      QTS_DB_PASSWORD: ${QTS_APP_DB_PASSWORD}
    command:
      - trade
      - --dry-run
      - --config
      - /freqtrade/configs/freqtrade/config.json
      - --config
      - /freqtrade/configs/freqtrade/config.api.json
      - --strategy
      - QtsTrendFollowing
    volumes:
      - qts-state:/freqtrade/state
      - freqtrade-data:/freqtrade/user_data/data
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Automatic backups: one shortly after start, then every BACKUP_INTERVAL_HOURS.
  backup-scheduler:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      <<: *admin-db
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
    volumes:
      - ${QTS_BACKUP_DIR:-./backups}:/backups
      - qts-state:/state:ro
      - ./docker/postgres/backup.sh:/backup.sh:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        sleep 120;
        while true; do
        /bin/sh /backup.sh || true;
        sleep $$((BACKUP_INTERVAL_HOURS * 3600));
        done
    depends_on:
      migrate:
        condition: service_completed_successfully

  # One backup, now (see scripts/backup.sh).
  backup:
    profiles: ["backup"]
    image: postgres:17-alpine
    environment:
      <<: *admin-db
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
    volumes:
      - ${QTS_BACKUP_DIR:-./backups}:/backups
      - qts-state:/state:ro
      - ./docker/postgres/backup.sh:/backup.sh:ro
    entrypoint: ["/bin/sh", "/backup.sh"]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  grafana-data:
  qts-data:
  qts-state:
  freqtrade-data:
